<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Bot Download</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #080d19; color: #f5f7ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .page { width: min(100%, 760px); margin: 0 auto; padding: 18px 14px 28px; }
    header { display:flex; align-items:center; gap:10px; padding:8px 4px 18px; font-size:clamp(22px, 6vw, 30px); font-weight:750; letter-spacing:.3px; }
    .logo { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg,#15c7ff,#8754ff); font-size:22px; }
    .hero { border:1px solid #29334d; border-radius:22px; overflow:hidden; background:#10182a; box-shadow:0 12px 40px #0006; }
    .hero img { display:block; width:100%; height:auto; }
    .actions { padding:18px; text-align:center; }
    .download { width:100%; display:block; border:0; border-radius:16px; padding:17px 16px; background:linear-gradient(180deg,#27e548,#0ebc2e); color:#fff; font-size:20px; font-weight:800; text-decoration:none; box-shadow:0 0 22px #1ce64144; cursor:pointer; }
    .download:active { transform:scale(.99); }
    .note { color:#9aa7c2; font-size:14px; margin:12px 0 0; }
    footer { color:#8490aa; text-align:center; font-size:13px; padding:20px 8px 0; }
  </style>
</head>
<body>
  <main class="page">
    <header><span class="logo">⬇</span><span>Bot Download</span></header>
    <section class="hero">
      <img src="bot-image.png" alt="Minecraft Bot — автоматический игровой помощник">
      <div class="actions">
        <button class="download" type="button" onclick="alert('Файл бота пока не готов. Кнопку подключим, когда бот будет создан.')">⬇　СКАЧАТЬ БОТА</button>
        <p class="note">Файл бота появится здесь, когда мы его создадим.</p>
      </div>
    </section>
    <footer>Простой • Быстрый • Удобный</footer>
  </main>
</body>
</html>
